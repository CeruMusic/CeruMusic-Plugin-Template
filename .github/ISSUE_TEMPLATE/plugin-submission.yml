name: 社区插件成品投稿
description: 提交可安装的 CeruMusic 插件成品
title: 'plugins: '
body:
  - type: markdown
    attributes:
      value: |
        该 Issue 用于投稿前沟通。实际文件请通过 Pull Request 提交。请勿填写账号凭据、私钥或用户数据。
  - type: input
    id: plugin_name
    attributes:
      label: 插件名称
      placeholder: 示例音源
    validations:
      required: true
  - type: input
    id: plugin_id
    attributes:
      label: 稳定插件 ID
      placeholder: example.author.plugin
    validations:
      required: true
  - type: dropdown
    id: api_version
    attributes:
      label: 插件 API 版本
      options:
        - v2
        - v3
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 投稿版本
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 功能与适用场景
      description: 说明用户能做什么，以及需要什么宿主或账号条件。
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 权限、网络访问与数据处理
      description: 列出所需权限、访问的服务、读取或写入的数据，以及凭据保存方式。
    validations:
      required: true
  - type: dropdown
    id: source_open
    attributes:
      label: 是否提供作者源码仓库
      options:
        - 提供
        - 暂不提供
    validations:
      required: true
  - type: input
    id: source_repository
    attributes:
      label: 作者源码仓库 URL（可选）
      description: 仅填写开发者自己维护的源码仓库地址，不要填写本投稿仓库中的成品目录。
      placeholder: https://github.com/author/plugin-source
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: 已完成的验证
      description: 列出本地校验、目标宿主测试及尚未覆盖的范围。
    validations:
      required: true
